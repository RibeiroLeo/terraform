name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [master]
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

# The active pipeline never requests cloud credentials.
permissions:
  contents: read
  # Enable only when the commented OIDC login steps become active:
  # id-token: write

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  format:
    name: 1 · Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: 2 · Validate · ${{ matrix.stack }}
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - aws-ecs
          - aws-eks
          - azure-container-apps
          - azure-aks
    defaults:
      run:
        working-directory: environments/${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color

  security:
    name: 2 · Security
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan critical IaC findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"
          hide-progress: true

  plan:
    name: 3 · Offline plan · ${{ matrix.stack }}
    needs: [validate, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - aws-ecs
          - aws-eks
          - azure-container-apps
          - azure-aks
    defaults:
      run:
        working-directory: environments/${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -no-color

      # Future authenticated AWS plan (keep disabled until OIDC exists):
      # - name: Login to AWS with OIDC
      #   if: startsWith(matrix.stack, 'aws-')
      #   uses: aws-actions/configure-aws-credentials@v6
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #     aws-region: us-east-1

      # Future authenticated Azure plan (keep disabled until OIDC exists):
      # - name: Login to Azure with OIDC
      #   if: startsWith(matrix.stack, 'azure-')
      #   uses: azure/login@v3
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ vars.AZURE_TENANT_ID }}
      #     subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate offline speculative plan
        shell: bash
        run: |
          set -o pipefail
          terraform test -verbose -no-color | tee plan.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.stack }}-offline-plan
          path: environments/${{ matrix.stack }}/plan.txt
          if-no-files-found: error
          retention-days: 7

  # Future post-plan confirmation (keep disabled until real plans exist):
  # approve-plan:
  #   name: 4 · Human approval
  #   needs: plan
  #   runs-on: ubuntu-latest
  #   environment: terraform-plan-approval
  #   steps:
  #     - run: echo "Authenticated plans were reviewed and approved."
